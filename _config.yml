# Site settings
title: Birds Near Me
description: Worldwide birding field guide for iOS. Free. No ads. Privacy respected.
url: https://birdsnearme.com
icon: /icon.png
start_year: 2014
author:
  name: Gerry Shaw
  email: gerry_shaw@yahoo.com
  url: https://gshaw.ca

# Build settings
markdown: kramdown

kramdown:
  input: GFM

exclude: [
  "AGENTS.md",
  "CLAUDE.md",
  "cspell.config.yaml",
  "Gemfile",
  "Gemfile.lock",
  "LICENSE",
  "README.md",
  "scripts",
  "vendor"
]

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
