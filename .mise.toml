[tools]
# Cloudflare Pages reads HUGO_VERSION from the project's settings: change both
# together. See AGENTS.md.
hugo = "0.167.0"
node = "24.4.1"
"npm:cspell" = "9.1.5"
"npm:markdownlint-cli2" = "0.22.1"
lychee = "0.24.2"

[tasks.dev]
run = "hugo server --port 4002 --openBrowser"

[tasks.build]
run = "hugo --quiet --cleanDestinationDir --panicOnWarning"

[tasks.spell]
run = "cspell lint --no-progress ."

[tasks.markdownlint]
run = """
out=$(markdownlint-cli2 '**/*.md' 2>&1) && echo "Markdown lint passed" || { echo "$out"; exit 1; }
"""

# Internal links and images only. External sites rate-limit and flake; check
# them by hand with `lychee public` when it matters. Links leave off .html, as
# Cloudflare serves /privacy.html at /privacy.
[tasks.links]
depends = ["build"]
run = "lychee --offline --no-progress --fallback-extensions html --root-dir \"$PWD/public\" 'public/**/*.html'"

[tasks.check]
depends = ["spell", "markdownlint", "links"]

# Run by deploy once Cloudflare Pages has built main.
[tasks.verify]
run = """
set -e
curl -fsS https://birdsnearme.com/ | grep -q "<title>Birds Near Me"
echo "birdsnearme.com is up"
test "$(curl -s -o /dev/null -w '%{http_code}' https://birdsnearme.com/no-such-page/)" = 404
echo "404 page works"
"""

# The one way to production. See Workshop's Tooling/deploy.md. Cloudflare Pages
# builds main on push, so the push is the deploy and main may be ahead of origin.
# The guard runs again after check in case check changed a file.
[tasks.deploy]
run = [
  "scripts/deploy-guard.sh --allow-ahead",
  "mise run check",
  "scripts/deploy-guard.sh --allow-ahead",
  "git push origin main",
  "scripts/pages-status.sh --wait",
  "mise run verify",
  'echo "✅ $(git rev-parse --short HEAD) is live on birdsnearme.com and verified."',
]

[tasks.deploy-status]
run = "scripts/pages-status.sh"
