# cspell:ignore robotstxt linkify
baseURL = "https://birdsnearme.com/"
title = "Birds Near Me"
disableHugoGeneratorInject = true
# No sitemap, robots.txt or RSS, as before. content/404.md is the 404 page.
disableKinds = ["taxonomy", "term", "section", "rss", "sitemap", "robotstxt", "404"]
# Pages at /privacy.html, the URLs they always had. Cloudflare serves them at /privacy,
# which is the canonical URL.
uglyURLs = true

[params]
description = "Worldwide birding field guide for iOS. Free. No ads. Privacy respected."
icon = "/icon.png"
start_year = 2014
[params.author]
name = "Gerry Shaw"
email = "gerry_shaw@yahoo.com"
url = "https://gshaw.ca"

[markup.goldmark.renderer]
unsafe = true    # raw HTML in Markdown: screenshots, App Store badge
[markup.goldmark.extensions]
linkify = false # bare URLs stay text, as they always have
